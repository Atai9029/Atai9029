<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D0D0C"/>
      <stop offset="0.55" stop-color="#1A1B19"/>
      <stop offset="1" stop-color="#3A1512"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>
  <rect width="900" height="240" fill="url(#scan)"/>

  <!-- frame -->
  <rect x="14" y="14" width="872" height="212" fill="none" stroke="#6B6F66" stroke-width="1.5" opacity="0.6"/>
  <rect x="22" y="22" width="856" height="196" fill="none" stroke="#6B6F66" stroke-width="0.5" opacity="0.5"/>

  <!-- perforation -->
  <g fill="#0D0D0C" stroke="#2a2b28">
    <circle cx="7" cy="40" r="3"/><circle cx="7" cy="80" r="3"/><circle cx="7" cy="120" r="3"/>
    <circle cx="7" cy="160" r="3"/><circle cx="7" cy="200" r="3"/>
  </g>

  <!-- header line -->
  <text x="44" y="52" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6B6F66" letter-spacing="4">STRENG VERTRAULICH — NUR FÜR DEN DIENSTGEBRAUCH</text>
  <line x1="44" y1="62" x2="640" y2="62" stroke="#6B6F66" stroke-width="1" opacity="0.6"/>

  <!-- title -->
  <text x="44" y="138" font-family="'Courier New', Courier, monospace" font-size="72" font-weight="bold" fill="#B8B29A" letter-spacing="6">ATAI9029</text>

  <!-- subtitle -->
  <text x="46" y="172" font-family="'Courier New', Courier, monospace" font-size="18" fill="#6B6F66" letter-spacing="3">VERSCHLUSSSACHE // AKTE Nr. 0001</text>

  <!-- censor bars -->
  <rect x="46" y="192" width="190" height="12" fill="#B8B29A" opacity="0.85"/>
  <rect x="246" y="192" width="90" height="12" fill="#B8B29A" opacity="0.85"/>
  <rect x="346" y="192" width="130" height="12" fill="#B8B29A" opacity="0.85"/>

  <!-- stamp -->
  <g transform="rotate(-12 740 130)">
    <rect x="620" y="85" width="240" height="90" fill="none" stroke="#7A1F1A" stroke-width="5" opacity="0.9"/>
    <rect x="628" y="93" width="224" height="74" fill="none" stroke="#7A1F1A" stroke-width="1.5" opacity="0.9"/>
    <text x="740" y="142" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="46" font-weight="bold" fill="#7A1F1A" letter-spacing="6" opacity="0.95">GEHEIM</text>
  </g>

  <!-- blinking cursor -->
  <rect x="520" y="104" width="14" height="34" fill="#7A1F1A">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
